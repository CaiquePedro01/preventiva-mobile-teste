<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Preventiva Mobile</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="phone-shell">
    <header class="app-header">
      <button id="back-button" class="icon-button" type="button" aria-label="Voltar">←</button>
      <div><strong>Preventiva Mobile</strong><small>Manutenção preventiva</small></div>
      <button id="budgets-button" class="header-action" type="button">Orçamentos</button>
    </header>
    <nav id="progress" class="progress" aria-label="Progresso"></nav>
    <div id="notice" class="notice" role="alert" hidden></div>
    <section id="app" aria-live="polite"></section>
  </main>
  <script src="app.js"></script>
</body>
</html>
